name: visa-radar

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub'ın izin verdiği en sık aralık (yoğunlukta gecikebilir)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | test | dump"
        default: "normal"

permissions:
  contents: read
  actions: write               # cache yazabilmek için

concurrency:
  group: visa-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # state.json'u önceki çalışmadan geri yükle (bildirim tekrarını önler)
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: visa-radar-state-${{ github.run_id }}
          restore-keys: visa-radar-state-

      - name: Kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_COUNTRY:     ${{ vars.SOURCE_COUNTRY    || 'tur' }}
          MISSION_COUNTRIES:  ${{ vars.MISSION_COUNTRIES || 'che,nld,aut,svk' }}
          CITIES:             ${{ vars.CITIES            || '' }}
          VISA_KEYWORDS:      ${{ vars.VISA_KEYWORDS     || 'tourism,turizm,turist,short,kisa' }}
          VISA_API_URLS:      ${{ vars.VISA_API_URLS     || '' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          case "$MODE" in
            test) python3 check.py --test ;;
            dump) python3 check.py --dump ;;
            *)    python3 check.py ;;
          esac
          [ -f state.json ] || echo '{}' > state.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: visa-radar-state-${{ github.run_id }}
